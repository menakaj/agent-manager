apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: am-local-deployment
image: rancher/k3s:v1.32.9-k3s1
servers: 1
agents: 0
kubeAPI:
  hostPort: "6550"
# Port mappings for k3d single-cluster local development.
# With the unified gateway architecture:
#   - AMP Gateway (8080/8443): routes Console, API, Thunder, Traces Observer, Gateway Mgmt
#   - Data Plane kgateway (19080/19443): routes deployed agent workloads
#   - AI Gateway (8084/8243): API Platform gateway for AI agent traffic
#   - Obs Gateway (22893/22894): API Platform gateway for OTel ingestion
# Individual AMP services (Console, API, etc.) use ClusterIP and are accessed
# through the AMP Gateway — no individual port mappings needed.
ports:
  # AMP Gateway (kgateway in wso2-amp namespace)
  # Routes: Console, API, Thunder, Traces Observer, Gateway Mgmt via HTTPRoutes
  - port: 8080:8080
    nodeFilters:
      - loadbalancer
  - port: 8443:8443
    nodeFilters:
      - loadbalancer
  # AI Gateway (API Platform gateway runtime)
  - port: 8084:8084
    nodeFilters:
      - loadbalancer
  - port: 8243:8243
    nodeFilters:
      - loadbalancer
  # Data Plane kgateway — routes deployed agent workloads
  - port: 19080:19080
    nodeFilters:
      - loadbalancer
  - port: 19443:19443
    nodeFilters:
      - loadbalancer
  # Workflow Plane — Container Registry for built images
  - port: 10082:10082
    nodeFilters:
      - loadbalancer
  # Observability Plane kgateway (internal plane communication)
  - port: 11080:11080
    nodeFilters:
      - loadbalancer
  - port: 11085:11085
    nodeFilters:
      - loadbalancer
  # OpenSearch API (for debugging and Fluent Bit data pushing)
  - port: 11082:9200
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Add host.k3d.internal to API server TLS certificate SANs.
      # This allows consistent DataPlane configuration across single and multi-cluster setups
      # where Control Plane pods can access the API server via host.k3d.internal:6550
      - arg: "--tls-san=host.k3d.internal"
        nodeFilters:
          - server:*
      # Configure kubelet eviction thresholds to prevent resource exhaustion
      - arg: "--kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%"
        nodeFilters:
          - server:*
      - arg: "--kubelet-arg=eviction-minimum-reclaim=imagefs.available=1%,nodefs.available=1%"
        nodeFilters:
          - server:*
      # Disable Traefik to avoid conflicts with OpenChoreo Gateway controller
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
# Configure insecure registries for HTTP access
# Allows kubelet to pull images from Workflow Plane registry via HTTP
registries:
  config: |
    mirrors:
      "host.k3d.internal:10082":
        endpoint:
          - http://host.k3d.internal:10082

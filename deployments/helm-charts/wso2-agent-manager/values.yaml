# Default values for agent-management-platform
global:
  imagePullSecrets: []
  storageClass: ""

# PostgreSQL Database Configuration
postgresql:
  enabled: true
  external:
    host: ""
    port: 5432
    database: agentmanager
    username: agentmanager
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: "password"
  # Image configuration - use stable PostgreSQL 16 image
  auth:
    database: agentmanager
    username: agentmanager
    password: "agentmanager"
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m

# Agent Manager Service Configuration
agentManagerService:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/wso2/amp-api
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9000
    targetPort: 8080
    annotations: {}

  gatewayMgtService:
    type: ClusterIP
    port: 9243
    targetPort: 9243

  # Internal server configuration
  internalServer:
    # Enable TLS for the internal server. When false, serves plain HTTP.
    tlsEnabled: true

  observer:
    url: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"
    username: "admin"
    password: "admin"

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ~

  # Health checks
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 10

  readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10

  # Application configuration
  config:
    serverHost: "0.0.0.0"
    logLevel: "INFO"
    autoMaxProcsEnabled: "true"
    authHeader: "Authorization"
    dbOperationTimeout: 30
    healthCheckTimeout: 5
    corsAllowedOrigin: "*"
    observerURL: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"

    # TLS Configuration
    tlsEnabled: false
  
    # API Key configuration
    apiKey:
      header: "X-API-Key"
      value: "abc-def-123"
      existingSecret: ""
      existingSecretKey: "api-key"

    # Encryption key for secrets at rest (hex-encoded 32-byte AES-256 key)
    # Must be exactly 64 hex characters. Auto-generated if not provided.
    encryptionKey:
      value: ""
      existingSecret: ""
      existingSecretKey: "encryption-key"

    # Kubeconfig (empty for in-cluster, or provide config)
    kubeconfig: ""

    # OpenTelemetry configuration
    otel:
      traceContent: "true"
      exporterEndpoint: "http://obs-gateway-gateway-gateway-runtime.openchoreo-data-plane.svc.cluster.local:22893/otel"

    # Key Manager configuration
    keyManager:
      issuer: "http://thunder.amp.localhost:8080"
      audience: "amp-console-client,amp-api-client,amp-publisher-client"
      jwksUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/jwks"

    # On-premise deployment flag
    isOnPremDeployment: "true"

    # OIDC configuration for Thunder integration
    oidc:
      tokenUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/token"
      clientId: "amp-api-client"
      clientSecret: "amp-api-client-secret"
    # JWT Signing configuration
    jwtSigning:
      privateKeyPath: "/app/keys/private.pem"
      publicKeysConfig: "/app/keys/public-keys-config.json"
      activeKeyId: "key-1"
      defaultExpiry: "8760h"
      issuer: "agent-manager-service"
      defaultEnvironment: "default"
    # GitHub configuration for repository API access
    github:
      token: ""
      existingSecret: ""
      existingSecretKey: "github-token"
    
    # OpenChoreo API configuration
    openChoreo:
      baseURL: "http://openchoreo-api.openchoreo-control-plane:8080"

    # Secret Manager configuration
    secretManager:
      provider: "openbao"
      baseURL: ""

    # OpenBao KV store configuration (Data Plane - for deployment secrets)
    openbao:
      # OpenBao URL
      url: "http://amp-secrets-openbao.amp-secrets.svc.cluster.local:8200"
      # KV secrets engine path
      path: "secret"
      version: "v2"
      # OpenBao token (for dev mode, use "root")
      # For production, use existingSecret to reference a secret containing the token
      token: "root"
      existingSecret: ""
      existingSecretKey: "openbao-token"

    # Workflow Plane OpenBao configuration (for Git Secrets)
    # Used to fetch git credentials for private repository access
    workflowPlaneOpenbao:
      # Workflow plane OpenBao URL
      url: "http://openbao.openbao.svc.cluster.local:8200"
      # OpenBao token
      token: "root"
      existingSecret: ""
      existingSecretKey: "openbao-token"
  # Certificate configuration
  certificates:
    # REQUIRED: Kubernetes secret name containing TLS certificates
    # Expected keys in secret: cert.pem (certificate), key.pem (private key)
    # Example creation:
    #   kubectl create secret generic amp-tls-certs \
    #     --from-file=cert.pem=/path/to/cert.pem \
    #     --from-file=key.pem=/path/to/key.pem
    # For development, leave empty to generate self-signed certs at runtime (insecure)
    certificatesSecret: ""

  agentWorkload:
    cors:
      allowedOrigin: "http://console.amp.localhost:8080"
      allowedMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      allowedHeaders: "authorization,Content-Type,Origin"

  # Pod-level configurations
  podAnnotations: {}
  podLabels: {}
  # Pod security context - defaults to fsGroup: 1000 if not specified
  # Note: If you encounter "too many open files" errors, this is typically caused by
  # the Kubernetes client watching too many resources. Consider:
  # 1. Reducing the number of watched resources in the application
  # 2. Implementing resource filtering in watchers
  # 3. Increasing limits at the node/cluster level
  podSecurityContext: {}
  # Container security context - defaults to secure settings if not specified
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Console (Frontend) Configuration
console:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/wso2/amp-console
    tag: "0.0.0-dev"
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ~

  # Health checks
  livenessProbe: null
  readinessProbe: null

  # Frontend configuration
  config:
    # Authentication (set to "" to disable)
    auth:
      clientId: "amp-console-client"
      baseUrl: "http://thunder.amp.localhost:8080"
      scopes: "openid profile email"
      signInRedirectURL: "http://console.amp.localhost:8080/login"
      signOutRedirectURL: "http://console.amp.localhost:8080/login"
      existingSecret: ""
      validateIDToken: "false"
      clockTolerance: 300

    # Disable auth for development
    disableAuth: "false"

    # Backend API URLs (will be auto-configured if empty)
    apiBaseUrl: "http://api.amp.localhost:8080"
    # Traces Observer Service URL — browser calls this directly for trace data.
    obsApiBaseUrl: "http://obs.amp.localhost:8080"
    # Gateway control plane URL for gateway setup commands (default: http://localhost:9243)
    gatewayControlPlaneUrl: "host.docker.internal:9243"
    # Gateway version for setup commands (default: v1.0.0)
    gatewayVersion: "v1.0.0"
    instrumentationUrl: "https://localhost:22894/otel"
    # Guardrails catalog URL for fetching available guardrail policies
    guardrailsCatalogUrl: "https://db720294-98fd-40f4-85a1-cc6a3b65bc9a-prod.e1-us-east-azure.choreoapis.dev/api-platform/policy-hub-api/policy-hub-public/v1.0/policies?categories=AI,Guardrails&limit=50"
    # Guardrails definition base URL for fetching policy definitions
    guardrailsDefinitionBaseUrl: "https://db720294-98fd-40f4-85a1-cc6a3b65bc9a-prod.e1-us-east-azure.choreoapis.dev/api-platform/policy-hub-api/policy-hub-public/v1.0/policies"

  # Pod-level configurations
  podAnnotations: {}
  podLabels: {}
  # Pod security context - optional, no defaults to allow image to use its own user
  # If you need to set fsGroup or other pod-level security settings, specify them here
  podSecurityContext: {}
  # Container security context - defaults to secure settings (without runAsUser to allow image default)
  # If you need to set runAsUser or other container-level security settings, specify them here
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database Migration Job Configuration
dbMigration:
  enabled: true

  image:
    repository: ghcr.io/wso2/amp-api
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
      
  backoffLimit: 3
  podSecurityContext: {}
  securityContext: {}

# JWT Keys Generation Job Configuration
jwtKeysGeneration:
  enabled: true
  backoffLimit: 3

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

  # Security context for JWT keys generation job
  # Allows root access for apk package installation (openssl, kubectl)
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    fsGroup: 0
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

# TLS Certificates Generation Job Configuration
tlsCertsGeneration:
  enabled: true
  backoffLimit: 3

  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

  # Security context for TLS certs generation job
  # Allows root access for apk package installation (openssl, kubectl)
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
    fsGroup: 0
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

# JWT Signing Keys Configuration
jwtSigning:
  # Specify an existing secret containing JWT keys (optional)
  # If not specified, keys will be auto-generated by the jwt-keys-generation job
  existingSecret: ""

# ServiceAccount Configuration
serviceAccount:
  create: true
  name: "agent-management-platform"
  annotations: {}
  automount: true

# RBAC Configuration
rbac:
  create: true
  # Rules scoped to what the Agent Manager service account actually needs:
  # - Secrets: created/managed by JWT keys generation and TLS certs jobs
  # - Gateway API resources: managed by the AMP Gateway templates
  # - ConfigMaps: read access for configuration
  rules:
    # Core API: Secrets (for JWT keys + TLS certs jobs)
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list", "create", "update", "patch"]
    # Core API: ConfigMaps (read access for config)
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list"]
    # Core API: Services, Pods (read for health checks and service discovery)
    - apiGroups: [""]
      resources: ["services", "pods"]
      verbs: ["get", "list", "watch"]
    # Core API: Namespaces (read for cross-namespace routing)
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list"]
    # Gateway API: Gateways and HTTPRoutes (managed by AMP Gateway templates)
    - apiGroups: ["gateway.networking.k8s.io"]
      resources: ["gateways", "httproutes"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Gateway API: ReferenceGrants (for cross-namespace backend references)
    - apiGroups: ["gateway.networking.k8s.io"]
      resources: ["referencegrants"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# AMP Gateway Configuration (Kubernetes Gateway API)
# ---------------------------------------------------------------------------
# AMP Gateway — Kubernetes Gateway API routing for AMP services
# ---------------------------------------------------------------------------
# Exposes Console, API, Traces Observer, Thunder, and Gateway Mgmt through
# a single gateway using HTTPRoutes with hostname-based routing.
#
# Two modes:
#
#   1. Shared gateway (default) — attaches HTTPRoutes to the OpenChoreo
#      Control Plane kgateway that already exists on port 8080. No extra
#      LoadBalancer is created. This is the mode used by k3d and quick-start.
#
#   2. Dedicated gateway — creates a new Gateway resource with its own
#      LoadBalancer. Use this for production / managed K8s where you want a
#      separate entry point for AMP with real domains and TLS.
#
# To switch to dedicated gateway mode, set:
#   routeConfig.createGateway=true
#   routeConfig.parentGateway.name=""
#   routeConfig.parentGateway.namespace=""
#   routeConfig.routes.*.hostname=<your production hostnames>
# ---------------------------------------------------------------------------
routeConfig:
  # Master switch — set to false to skip all gateway/route resources.
  enabled: true

  # --- Routing (applies to both modes) -----------------------------------

  # HTTPRoute hostnames for each AMP service.
  # Defaults use *.amp.localhost (resolves to 127.0.0.1 per RFC 6761).
  # For production, override with real domain names.
  routes:
    console:
      hostname: "console.amp.localhost"
    api:
      hostname: "api.amp.localhost"
    tracesObserver:
      hostname: "obs.amp.localhost"
      serviceName: amp-traces-observer
      serviceNamespace: openchoreo-observability-plane
      servicePort: 9098
    gatewayMgmt:
      hostname: "gw-mgmt.amp.localhost"
    # Thunder route is only created when createGateway=true.
    # In shared mode the Thunder chart creates its own route on the CP kgateway.
    thunder:
      hostname: "thunder.amp.localhost"
      serviceName: amp-thunder-extension-service
      serviceNamespace: amp-thunder
      servicePort: 8090

  # --- Shared gateway mode (default) ------------------------------------

  # Existing gateway to attach HTTPRoutes to.
  # Defaults to the OpenChoreo CP kgateway (shared with Thunder, OpenChoreo API).
  parentGateway:
    name: "gateway-default"
    namespace: "openchoreo-control-plane"

  # --- Dedicated gateway mode --------------------------------------------

  # Set to true to create a new Gateway resource with its own LoadBalancer.
  createGateway: false
  # Settings below only apply when createGateway is true.
  gatewayClassName: kgateway
  httpPort: 80
  httpsPort: 443
  hostname: ""             # Wildcard listener hostname (e.g. "*.example.com")
  tls:
    secretName: ""         # TLS secret for HTTPS listener (e.g. cert-manager Secret)

# Global volume mounts and volumes (optional)
volumeMounts: []
volumes: []

# Common labels to add to all resources
commonLabels: {}

{{- if .Values.httpRoute.enabled }}
---
# HTTPRoute for AI Gateway runtime traffic through the Data Plane kgateway.
# This follows the same routing pattern used by agent deployment HTTPRoutes,
# replacing the AI Gateway runtime's own LoadBalancer service.
#
# The gateway-operator names the runtime service as:
#   <gateway-name>-gateway-gateway-runtime
# where <gateway-name> is the APIGateway CR name (e.g. "default-ai").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-route
  namespace: {{ .Values.apiGateway.namespace }}
  labels:
    {{- include "wso2-amp-gateway-extension.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-gateway-route
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentGateway.name }}
      namespace: {{ .Values.httpRoute.parentGateway.namespace }}
  {{- if .Values.httpRoute.hostname }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "wso2-amp-gateway-extension.apiGatewayName" . }}-gateway-gateway-runtime
          port: 8084
{{- end }}
